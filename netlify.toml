# Netlify Configuration for Movie Stream (Vite + React SPA)

[build]
  publish = "dist"
  command = "npm run build"

# SPA routing redirect (ensures client-side routes don't 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
